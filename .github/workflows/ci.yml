# Frontend archive CI — minify bundles + Lighthouse only.
# Quant tests, ruff, bandit, MkDocs, Doppler, and Pages deploy run locally / in the
# sunset freeze script, not on every push: the desk data is frozen so they gate nothing
# here. Rationale + local commands: see README "Archive design & CI notes".

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  minify-and-lighthouse:
    name: Minify & Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Minify frontend CSS and JS
        run: bun run minify:frontend

      - name: Assert committed minified bundles are current
        run: |
          set -euo pipefail
          paths=(
            frontend/styles/bundle.css
            frontend/styles/bundle.min.css
            frontend/js/base-path.min.js
            frontend/js/main.min.js
            frontend/js/splash-liquid-gradient.min.js
          )
          stale=()
          for path in "${paths[@]}"; do
            if ! git diff --quiet -- "$path"; then
              stale+=("$path")
            fi
          done
          if [ "${#stale[@]}" -ne 0 ]; then
            echo "Stale minified artifacts (run bun run minify:frontend and commit):"
            printf ' - %s\n' "${stale[@]}"
            git diff --stat -- "${stale[@]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse runner dependencies
        run: bun install --frozen-lockfile

      - name: Run Lighthouse (mobile)
        run: bun scripts/lighthouse_ci.mjs
        env:
          LH_RUNNER: node

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          if-no-files-found: ignore
          retention-days: 14
