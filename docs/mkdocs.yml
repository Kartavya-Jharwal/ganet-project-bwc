site_name: Ganet - Project BWC
site_description: Team 5 Investment Simulation — Hult International Business School
site_url: https://kartavya-jharwal.github.io/ganet-project-bwc/
repo_url: https://github.com/Kartavya-Jharwal/ganet-project-bwc
repo_name: ganet-project-bwc
docs_dir: .
site_dir: ../frontend/docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.follow

exclude_docs: |
  archive/**
  DOCS_LAYOUT.md
  *.py

nav:
  - Home: index.md
  - Deliverables (BWX): deliverables-index.md
  - Getting Started:
    - Development Guide: development.md
    - Architecture: architecture.md
    - Design Decisions: design.md
  - Implementation:
    - Phase index (0-21): phases/README.md
    - Phase 0 - Scaffold: phases/phase-00-scaffold.md
    - Phases 1-5: phases/phase-01-05-roadmap.md
    - Phases 6-10: phases/phase-06-10-core.md
    - Phases 11-21: phases/phase-11-21-track.md
    - Phase 22+ Advanced Analytics: phase-22-onwards-advanced-analytics.md
    - Phase FINALE - Endgame: phase-finale-endgame.md
    - Roadmap (detail): roadmap.md
    - Progress report: progress-report.md
  - Results:
    - Performance: performance.md
    - Interactive Dashboard: interactive-dashboard.md
    - Backtest Results: backtest-results.md
    - Monte Carlo Forward: monte-carlo-forward.md
    - Signal History: signals-history.md
  - Review:
    - External Reviewers: external-review.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

extra_css:
  - stylesheets/extra.css

plugins:
  - search
