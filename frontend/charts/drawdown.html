<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Desk drawdown</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        html, body { margin: 0; background: #050505; }
        #dd { width: 100%; height: 360px; }
    </style>
</head>
<body>
    <div id="dd"></div>
    <script>
        const dates = [
            '2026-02-02', '2026-02-12', '2026-02-17', '2026-02-24', '2026-03-02',
            '2026-03-03', '2026-03-09', '2026-03-12', '2026-03-16', '2026-03-20',
            '2026-03-23', '2026-03-30', '2026-04-02', '2026-04-07', '2026-04-08',
            '2026-04-11'
        ];
        const nav = [
            1000000, 998200, 996000, 989500, 977800, 971200, 963400, 958100,
            951200, 944800, 942100, 948300, 935600, 939200, 951800, 956279.80
        ];
        const ddPct = [];
        let peak = nav[0];
        let maxDd = 0;
        nav.forEach((v) => {
            peak = Math.max(peak, v);
            const dd = -((peak - v) / peak) * 100;
            ddPct.push(dd);
            maxDd = Math.min(maxDd, dd);
        });

        Plotly.newPlot('dd', [{
            x: dates, y: ddPct, mode: 'lines', name: 'Drawdown',
            line: { color: '#ff3366', width: 1.5 },
            fill: 'tozeroy', fillcolor: 'rgba(255,51,102,0.15)',
            hovertemplate: '%{y:.2f}%<extra>Drawdown</extra>'
        }], {
            title: { text: 'Drawdown Profile  <span style="color:#52525b;font-size:13px">(max ' + maxDd.toFixed(2) + '%)</span>', x: 0.02 },
            template: 'plotly_dark',
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: '#050505',
            font: { color: '#f4f4f5', family: 'Inter, system-ui, sans-serif', size: 12 },
            margin: { t: 60, b: 50, l: 60, r: 30 },
            height: 360,
            autosize: true,
            yaxis: { title: 'Drawdown (%)', ticksuffix: '%' },
            xaxis: { title: '' }
        }, { responsive: true, displaylogo: false });
    </script>
</body>
</html>
