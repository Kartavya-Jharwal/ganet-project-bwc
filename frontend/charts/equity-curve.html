<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Desk equity curve</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050505; }
        #equity { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="equity"></div>
    <script>
        const dates = [
            '2026-02-02', '2026-02-12', '2026-02-17', '2026-02-24', '2026-03-02',
            '2026-03-03', '2026-03-09', '2026-03-12', '2026-03-16', '2026-03-20',
            '2026-03-23', '2026-03-30', '2026-04-02', '2026-04-07', '2026-04-08',
            '2026-04-11'
        ];
        const nav = [
            1000000, 998200, 996000, 989500, 977800, 971200, 963400, 958100,
            951200, 944800, 942100, 948300, 935600, 939200, 951800, 956279.80
        ];
        const hwm = [];
        let peak = nav[0];
        nav.forEach((v) => { peak = Math.max(peak, v); hwm.push(peak); });

        const layout = {
            title: { text: 'Equity Curve  <span style="color:#52525b;font-size:13px">(−4.37% total · Feb 02 – Apr 11 2026)</span>', x: 0.02 },
            template: 'plotly_dark',
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: '#050505',
            font: { color: '#f4f4f5', family: 'Inter, system-ui, sans-serif', size: 12 },
            margin: { t: 48, b: 40, l: 64, r: 20 },
            autosize: true,
            yaxis: { title: 'Portfolio Value ($)', tickformat: '$,.0f' },
            xaxis: { title: '' }
        };

        Plotly.newPlot('equity', [
            {
                x: dates, y: nav, mode: 'lines', name: 'Portfolio NAV',
                line: { color: '#00ff88', width: 2 },
                fill: 'tozeroy', fillcolor: 'rgba(0,255,136,0.08)',
                hovertemplate: '$%{y:,.0f}<extra>NAV</extra>'
            },
            {
                x: dates, y: hwm, mode: 'lines', name: 'High-Water Mark',
                line: { color: '#a78bfa', width: 1, dash: 'dot' },
                hovertemplate: '$%{y:,.0f}<extra>HWM</extra>'
            }
        ], layout, { responsive: true, displaylogo: false });

        window.addEventListener('resize', () => Plotly.Plots.resize('equity'));
    </script>
</body>
</html>
