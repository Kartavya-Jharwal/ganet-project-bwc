<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Premium Gradient</title>
  <style>
    /* Reset and Base Styling */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      /* Deepest black/blue base to anchor the dark contrast */
      background-color: #030305; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* Main Container */
    .wavy-canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The Blur Wrapper
      Keeps the fluid melt effect intact.
    */
    .wave-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      filter: blur(100px); /* Slightly increased blur for richer dark blending */
      z-index: 1;
      transform: translate3d(0, 0, 0); 
    }

    /* Base setup for the overlapping linear sweeps */
    .wave-layer {
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      transform-origin: center center;
    }

    /* Wave 1: Deep Violet 
      Dark enough to support white text (> 7:1 contrast)
    */
    .wave-1 {
      background: linear-gradient(
        135deg, 
        rgba(59, 7, 100, 0.9) 10%,  /* Very Deep Purple */
        rgba(30, 27, 75, 0.7) 40%,   /* Dark Indigo */
        transparent 60%
      );
      animation: sweepWave 28s linear infinite;
    }

    /* Wave 2: Midnight Blue
      Cuts across the middle, adding rich color without adding light.
    */
    .wave-2 {
      background: linear-gradient(
        225deg, 
        transparent 30%, 
        rgba(15, 23, 42, 0.95) 50%,  /* Slate / Midnight */
        transparent 70%
      );
      animation: sweepWave 35s linear infinite reverse;
    }

    /* Wave 3: The Dark Anchor
      Ensures the bottom and center-areas stay deeply shaded.
    */
    .wave-3 {
      background: linear-gradient(
        0deg, 
        #000000 30%, 
        rgba(10, 10, 15, 0.9) 60%, 
        transparent 80%
      );
      animation: breatheWave 18s ease-in-out infinite alternate;
    }

    /* THE GRAIN: Embedded SVG noise filter */
    .noise-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.15;
      mix-blend-mode: overlay; 
    }

    /* Content Styling */
    .content {
      position: relative;
      z-index: 3;
      color: #FFFFFF; /* Pure white for maximum contrast */
      text-align: center;
      max-width: 800px;
      padding: 2rem;
    }

    .content h1 {
      font-size: clamp(3rem, 6vw, 6rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      margin: 0 0 1rem 0;
      /* Subtle text-shadow acts as a final safety net for WCAG compliance */
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .content p {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 300;
      color: rgba(255, 255, 255, 0.85); /* Slightly dimmed for hierarchy, still AAA */
      line-height: 1.6;
      margin: 0;
    }

    /* Animations */
    @keyframes sweepWave {
      0% { transform: rotate(0deg) translate(0%, 0%); }
      50% { transform: rotate(180deg) translate(3%, 3%); }
      100% { transform: rotate(360deg) translate(0%, 0%); }
    }

    @keyframes breatheWave {
      0% { transform: translateY(8%) scale(1); }
      100% { transform: translateY(-2%) scale(1.05); }
    }
  </style>
</head>
<body>

  <div class="wavy-canvas">
    
    <div class="wave-wrapper">
      <div class="wave-layer wave-1"></div>
      <div class="wave-layer wave-2"></div>
      <div class="wave-layer wave-3"></div>
    </div>

    <div class="noise-overlay"></div>

    <div class="content">
      <h1>Accessible & Fluid</h1>
      <p>This typography maintains a strict 7:1 contrast ratio against the shifting gradient background, ensuring WCAG AAA compliance without sacrificing the premium aesthetic.</p>
    </div>

  </div>

</body>
</html>
